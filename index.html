<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kam</title>
<meta name="theme-color" content="#12151b">
<meta name="description" content="Interaktiven zemljevid za odločanje, kam iti.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kam">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btnCompass" class="btn-compass" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/>
        <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="#fff"/>
        <circle cx="12" cy="12" r="1.3" fill="#38bdf8"/>
      </svg>
      <span>Vrži kompas</span>
    </button>
  </header>
  <div id="map"></div>
</div>

<section id="savedSection">
  <h2>Shranjene točke</h2>
  <div id="savedGrid" class="saved-grid"></div>
  <p id="savedEmpty" class="saved-empty">Ni še shranjenih točk.</p>
</section>

<div id="hintToast" class="hint-toast" hidden></div>

<div id="startOverlay" class="overlay">
  <div class="card">
    <h2>Start</h2>
    <p class="sub">Kje naj bo izhodišče?</p>
    <button id="btnCurrentLocation" class="option-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Trenutna lokacija</span>
    </button>
    <button id="btnPickOnMap" class="option-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 22s7-7.5 7-12.5A7 7 0 1 0 5 9.5C5 14.5 12 22 12 22Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span>Točka na zemljevidu</span>
    </button>
    <button id="btnStartCancel" class="btn-secondary" style="width:100%;margin-top:4px;" type="button">Prekliči</button>
  </div>
</div>

<div id="radiusPanel" class="radius-panel" hidden>
  <div class="row">
    <strong>Radij okoli izhodišča</strong>
    <span id="radiusValue">5 km</span>
  </div>
  <input id="radiusSlider" type="range" min="200" max="50000" step="100" value="5000">
  <div class="radius-actions">
    <button id="btnRadiusCancel" class="btn-secondary" type="button">Prekliči</button>
    <button id="btnRadiusConfirm" class="btn-primary" type="button">Potrdi</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
