<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kam</title>
<meta name="theme-color" content="#12151b">
<meta name="description" content="Interaktiven zemljevid za odločanje, kam iti.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kam">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btnCompass" class="btn-compass" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/>
        <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="#fff"/>
        <circle cx="12" cy="12" r="1.3" fill="#38bdf8"/>
      </svg>
      <span>Vrži kompas</span>
    </button>
    <div class="menu-wrap">
      <button id="btnMenu" class="btn-menu" type="button" title="Meni" aria-label="Meni" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="menuDropdown" class="menu-dropdown" hidden>
        <button id="menuItemSaved" class="menu-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <span>Shranjene točke</span>
        </button>
        <button id="menuItemAreas" class="menu-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 8.5 9 5l6 3.5 5-3v10.5l-5 3-6-3.5-5 3V8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9 5v10.5M15 8.5V19" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span>Shranjena območja</span>
        </button>
        <button id="menuItemMountains" class="menu-item" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="m4 17 5-8 3.2 4.5L14 10l6 7H4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="17" cy="7" r="1.4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Gorovja</span>
        </button>
      </div>
    </div>
  </header>
  <div id="map"></div>
  <div id="twoFingerHint" class="two-finger-hint" title="Za premik uporabi dva prsta" aria-label="Za premik uporabi dva prsta">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="8.6" cy="6" r="2.4" fill="currentColor"/>
      <circle cx="15.4" cy="6" r="2.4" fill="currentColor"/>
      <path d="M12 11.5v9M12 11.5l-2 2M12 11.5l2 2M12 20.5l-2-2M12 20.5l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.5 16h9M7.5 16l2-2M7.5 16l2 2M16.5 16l-2-2M16.5 16l-2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div id="savedBackdrop" class="saved-backdrop"></div>
<section id="savedSection" class="saved-drawer">
  <div class="saved-drawer-head">
    <h2>Shranjene točke</h2>
    <button id="btnSavedClose" class="saved-close-btn" type="button" aria-label="Zapri">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div id="savedGrid" class="saved-grid"></div>
  <p id="savedEmpty" class="saved-empty">Ni še shranjenih točk.</p>
</section>

<div id="savedAreasBackdrop" class="saved-backdrop"></div>
<section id="savedAreasSection" class="saved-drawer">
  <div class="saved-drawer-head">
    <h2>Shranjena območja</h2>
    <button id="btnSavedAreasClose" class="saved-close-btn" type="button" aria-label="Zapri">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <button id="btnAddArea" class="option-btn area-add-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span>Dodaj območje</span>
  </button>
  <button id="btnImportArea" class="option-btn area-add-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 4v10M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Uvozi območje</span>
  </button>
  <input id="importAreaFile" type="file" accept="application/json,.json" hidden>
  <hr class="panel-divider panel-divider-accent">
  <div id="savedAreasGrid" class="area-list"></div>
  <p id="savedAreasEmpty" class="saved-empty">Ni še shranjenih območij.</p>
</section>

<div id="savedMountainsBackdrop" class="saved-backdrop"></div>
<section id="savedMountainsSection" class="saved-drawer">
  <div class="saved-drawer-head">
    <h2>Gorovja</h2>
    <button id="btnSavedMountainsClose" class="saved-close-btn" type="button" aria-label="Zapri">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <button id="btnAddMountain" class="option-btn area-add-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span>Dodaj gorovje</span>
  </button>
  <button id="btnImportMountain" class="option-btn area-add-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 4v10M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Uvozi gorovje</span>
  </button>
  <input id="importMountainFile" type="file" accept="application/json,.json" hidden>
  <hr class="panel-divider panel-divider-accent">
  <div id="savedMountainsGrid" class="area-list"></div>
  <p id="savedMountainsEmpty" class="saved-empty">Ni še shranjenih gorovij.</p>
</section>

<div id="hintToast" class="hint-toast" hidden></div>

<div id="startOverlay" class="overlay">
  <div class="card">
    <h2>Start</h2>
    <p class="sub">Kje naj bo izhodišče?</p>
    <button id="btnCurrentLocation" class="option-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Trenutna lokacija</span>
    </button>
    <button id="btnPickOnMap" class="option-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 22s7-7.5 7-12.5A7 7 0 1 0 5 9.5C5 14.5 12 22 12 22Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span>Točka na zemljevidu</span>
    </button>
    <button id="btnPickArea" class="option-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 15.5 9 6l4.5 5.5L19 8v9.5H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="3 2.5"/>
        <circle cx="9" cy="6" r="1.6" fill="currentColor"/>
        <circle cx="19" cy="8" r="1.6" fill="currentColor"/>
      </svg>
      <span>Sam izberi območje</span>
    </button>
    <button id="btnStartCancel" class="btn-secondary" style="width:100%;margin-top:4px;" type="button">Prekliči</button>
  </div>
</div>

<div id="radiusPanel" class="radius-panel" hidden>
  <div id="radiusControls">
    <div class="row">
      <strong>Radij okoli izhodišča</strong>
      <span id="radiusValue">5 km</span>
    </div>
    <input id="radiusSlider" type="range" min="200" max="100000" step="100" value="5000">

    <div id="radiusPresets" class="radius-presets"></div>
  </div>

  <div id="pickModeGroup" class="pick-mode-group">
    <label class="pick-mode-row">
      <input type="radio" name="pickMode" id="pickModeRandom" value="random" checked>
      <span class="pick-mode-check" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Vrzi naključno</span>
    </label>
    <label class="pick-mode-row">
      <input type="radio" name="pickMode" id="pickModeMarked" value="marked">
      <span class="pick-mode-check" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 19h18L12 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Izberi vrh</span>
    </label>
  </div>

  <div id="eleFilter" class="ele-filter" hidden>
    <span class="ele-filter-label">Nadmorska višina (neobvezno)</span>
    <div class="ele-filter-inputs">
      <input id="eleMin" type="number" inputmode="numeric" placeholder="Od (m)" min="0" max="9000" step="50">
      <span class="ele-filter-sep">–</span>
      <input id="eleMax" type="number" inputmode="numeric" placeholder="Do (m)" min="0" max="9000" step="50">
    </div>

    <label class="pick-mode-row popular-toggle-row">
      <input type="checkbox" id="popularToggle">
      <span class="pick-mode-check" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.65l5.9-.85L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span>Prikaži priljubljene vrhove</span>
    </label>
  </div>

  <hr class="panel-divider">

  <label class="pick-mode-row draw-toggle-row">
    <input type="checkbox" id="drawAreaToggle">
    <span class="pick-mode-check" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 15.5 9 6l4.5 5.5L19 8v9.5H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="3 2.5"/>
      <circle cx="9" cy="6" r="1.6" fill="currentColor"/>
      <circle cx="19" cy="8" r="1.6" fill="currentColor"/>
    </svg>
    <span>Sam izberi območje</span>
  </label>

  <div id="drawStatus" class="draw-status" hidden>
    <span id="drawCount">Klikaj po zemljevidu</span>
    <span class="draw-status-actions">
      <button id="btnDrawEdit" type="button" title="Vlečenje točk">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 20l4.5-1L19 8.5a1.5 1.5 0 0 0 0-2.1l-1.4-1.4a1.5 1.5 0 0 0-2.1 0L5 15.5 4 20Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Uredi
      </button>
      <button id="btnDrawUndo" type="button">Nazaj</button>
      <button id="btnDrawClear" type="button">Počisti</button>
    </span>
  </div>

  <div class="radius-actions">
    <button id="btnRadiusCancel" class="btn-secondary" type="button">Prekliči</button>
    <button id="btnRadiusConfirm" class="btn-primary" type="button">Potrdi</button>
  </div>
</div>

<!-- Risanje novega shranjenega območja ali gorovja (iz zavihkov "Shranjena območja" /
     "Gorovja") — uporablja isto komponento za risanje kot "Sam izberi območje" zgoraj,
     le brez radija/izhodišča in z imenom ter gumbom Shrani namesto Potrdi. Naslov in
     placeholder se glede na izvor preklopita v JS (glej addAreaTarget). -->
<div id="areaAddPanel" class="radius-panel" hidden>
  <div class="row"><strong id="areaAddPanelTitle">Novo območje</strong></div>
  <input id="areaNameInput" class="area-name-input" type="text" maxlength="60" placeholder="Ime območja">

  <div id="areaDrawStatus" class="draw-status">
    <span id="areaDrawCount">Klikaj po zemljevidu</span>
    <span class="draw-status-actions">
      <button id="btnAreaDrawEdit" type="button" title="Vlečenje točk">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 20l4.5-1L19 8.5a1.5 1.5 0 0 0 0-2.1l-1.4-1.4a1.5 1.5 0 0 0-2.1 0L5 15.5 4 20Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Uredi
      </button>
      <button id="btnAreaDrawUndo" type="button">Nazaj</button>
      <button id="btnAreaDrawClear" type="button">Počisti</button>
    </span>
  </div>

  <div class="radius-actions">
    <button id="btnAreaAddCancel" class="btn-secondary" type="button">Prekliči</button>
    <button id="btnAreaAddSave" class="btn-primary" type="button">Shrani</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
